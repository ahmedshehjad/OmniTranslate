name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go for workflow linting
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Validate GitHub Actions workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Create ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests and compile debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload CI-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniTranslate-debug-ci-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
