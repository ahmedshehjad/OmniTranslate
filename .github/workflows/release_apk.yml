name: Build & Release OmniTranslate APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTranslate-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-release
          name: OmniTranslate v1.0.0 APK Release 📲
          body: |
            ## 📲 OmniTranslate Official APK Release

            ### ✨ Features Included:
            - ⚡ Floating screen bubble & mini translator card
            - 🌐 100% Offline Google ML Kit translation (Bangla + 17 languages)
            - 📋 Smart SQLite Clipboard History
            - 📷 Camera/Screenshot OCR Vision
            - 🔊 Text-to-Speech (TTS) Pronunciation
            - 🛡️ AdMob Test Device Mode Auto-configured
            - 📲 Official **GETMODDEVICE** community channel integration

            ### 📥 Download:
            Download the `app-debug.apk` asset below and install it directly on your Android phone!
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
