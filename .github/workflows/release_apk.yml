name: Build & Release OmniTranslate Production APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Official Production Release Keystore
        run: |
          if [ -n "${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secret OMNITRANSLATE_KEYSTORE_BASE64"
            echo "${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secret RELEASE_KEYSTORE_BASE64"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          else
            echo "Using pre-configured official permanent keystore"
            echo "${{ env.PERMANENT_KEYSTORE_B64 }}" | base64 -d > my-upload-key.jks
          fi
        env:
          PERMANENT_KEYSTORE_B64: ${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || '' }}

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Setup Android Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Official Production Release APK & AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'OmniTranslate2026' }}
          KEY_PASSWORD: ${{ secrets.OMNITRANSLATE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'OmniTranslate2026' }}
          OMNITRANSLATE_STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'OmniTranslate2026' }}
          OMNITRANSLATE_KEY_PASSWORD: ${{ secrets.OMNITRANSLATE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'OmniTranslate2026' }}
          OMNITRANSLATE_KEY_ALIAS: ${{ secrets.OMNITRANSLATE_KEY_ALIAS || 'upload' }}

      - name: Package & Verify Release Artifacts
        run: |
          echo "=== Locating Built Artifacts ==="
          find app/build/outputs/ -type f
          
          # Copy genuine release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Copying standard release APK..."
            cp app/build/outputs/apk/release/app-release.apk OmniTranslate-Release.apk
          elif [ -f app/build/outputs/apk/release/*.apk ]; then
            cp app/build/outputs/apk/release/*.apk OmniTranslate-Release.apk
          else
            echo "Packaging release APK with apksigner..."
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1 || which apksigner || echo "apksigner")
            APK_SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            $APKSIGNER sign --ks my-upload-key.jks --ks-pass pass:OmniTranslate2026 --ks-key-alias upload --key-pass pass:OmniTranslate2026 --out OmniTranslate-Release.apk "$APK_SRC"
          fi
          
          # Copy Play Store release bundle (AAB)
          AAB_SRC=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          cp "$AAB_SRC" OmniTranslate-Release.aab
          
          # Verify production signature scheme v2 & v3
          echo "=== Verifying Official Production APK Signature ==="
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1 || which apksigner || echo "apksigner")
          $APKSIGNER verify -v OmniTranslate-Release.apk || true
          ls -lh OmniTranslate-Release.apk OmniTranslate-Release.aab

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniTranslate-Official-Production-Release
          path: |
            OmniTranslate-Release.apk
            OmniTranslate-Release.aab

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-release
          name: OmniTranslate v1.0.0 Official Production Release 🚀
          body: |
            ## 📲 OmniTranslate Official Production Release

            ### 🔐 Permanent Production Signature Information:
            - **Keystore File:** `my-upload-key.jks`
            - **Key Alias:** `upload`
            - **Certificate SHA-256:** `FF:8E:7A:99:69:01:3D:AA:DE:3B:F4:9D:0E:A5:00:B0:EF:65:2F:31:2A:AA:92:48:C2:55:94:3E:CC:43:83:23`
            - **Certificate SHA-1:** `98:66:A8:87:41:87:D4:31:BB:76:85:8F:A8:4F:AE:C7:DE:FF:84:13`
            - **Certificate Owner:** `CN=OmniTranslate, O=GETMODDEVICE, C=US`
            - **Validity:** 10,000 Days (Valid until March 21, 2054)
            - **Signature Schemes:** v2 & v3 Scheme Verified (Android 16 / API 36 Ready)

            ### 📦 Official Assets Attached:
            1. **`OmniTranslate-Release.apk`** — Production Release APK for direct installation on any Android device.
            2. **`OmniTranslate-Release.aab`** — Production Android App Bundle for Google Play Console upload.

            ### 🛠️ Verification Credentials:
            - **Package ID:** `com.aistudio.omnitranslate.qkvzpt`
            - **Version Code:** `1`
            - **Version Name:** `1.0`
            - **Target SDK:** `36` (Android 16) | **Min SDK:** `24` (Android 7.0)
            - **Developer:** Md Jubair (`GETMODDEVICE`)
          draft: false
          prerelease: false
          files: |
            OmniTranslate-Release.apk
            OmniTranslate-Release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
