name: Build & Release OmniTranslate Production APK & AAB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Release Secrets
        run: |
          if [ -z "${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: OMNITRANSLATE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}" ]; then
            echo "ERROR: OMNITRANSLATE_STORE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OMNITRANSLATE_KEY_PASSWORD }}" ]; then
            echo "ERROR: OMNITRANSLATE_KEY_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OMNITRANSLATE_KEY_ALIAS }}" ]; then
            echo "ERROR: OMNITRANSLATE_KEY_ALIAS secret is not set"
            exit 1
          fi
          echo "All required secrets are present"

      - name: Setup Production Release Keystore
        run: |
          echo "Decoding keystore from GitHub Secret..."
          python3 -c "import base64, os; data = os.environ.get('SECRET_B64', '').strip(); open('release.keystore', 'wb').write(base64.b64decode(data)) if data else None"
          if [ ! -s release.keystore ]; then
            echo "ERROR: Failed to decode keystore"
            exit 1
          fi
          echo "Keystore decoded successfully"
          ls -lh release.keystore
        env:
          SECRET_B64: ${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Official Production Release APK & AAB
        run: |
          export KEYSTORE_PATH="$(pwd)/release.keystore"
          export STORE_PASSWORD="${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}"
          export KEY_PASSWORD="${{ secrets.OMNITRANSLATE_KEY_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.OMNITRANSLATE_KEY_ALIAS }}"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        env:
          OMNITRANSLATE_KEYSTORE_BASE64: ${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}

      - name: Verify APK Signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Verifying APK: $APK"
          apksigner verify --verbose "$APK"
          if [ $? -ne 0 ]; then
            echo "ERROR: APK signature verification failed"
            exit 1
          fi
          echo "APK signature verified successfully"

      - name: Verify AAB (zip integrity)
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "Verifying AAB: $AAB"
          python3 -c "import zipfile; z=zipfile.ZipFile('$AAB'); print('AAB is valid zip, entries:', len(z.namelist()))"
          if [ $? -ne 0 ]; then
            echo "ERROR: AAB verification failed"
            exit 1
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniTranslate-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: OmniTranslate ${{ github.event.inputs.tag }} Official Production Release
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
