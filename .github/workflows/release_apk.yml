name: OmniTranslate Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v1.0.1)"
        required: true
        default: "v1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: omnitranslate-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OMNITRANSLATE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNITRANSLATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          echo "All required release secrets are present (values are not displayed)."

      - name: Decode and validate production keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OMNITRANSLATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNITRANSLATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          raw = os.environ["KEYSTORE_B64"].strip()
          data = base64.b64decode(raw, validate=True)
          if not data:
              raise SystemExit("Decoded keystore is empty")
          with open("release.keystore", "wb") as f:
              f.write(data)
          PY
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore format, store password and alias validated."

      - name: Build release APK and AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          OMNITRANSLATE_STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}
          OMNITRANSLATE_KEY_PASSWORD: ${{ secrets.OMNITRANSLATE_KEY_PASSWORD }}
          OMNITRANSLATE_KEY_ALIAS: ${{ secrets.OMNITRANSLATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleRelease bundleRelease

      - name: Verify APK signature, package and version
        id: verify_apk
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.OMNITRANSLATE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OMNITRANSLATE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNITRANSLATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          APK_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' apk-signature.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          KEY_CERT="$(keytool -list -v -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256: / {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$APK_CERT" && test -n "$KEY_CERT"
          if [[ "$APK_CERT" != "$KEY_CERT" ]]; then
            echo "::error::APK signer certificate does not match the configured production keystore."
            exit 1
          fi
          AAB_CERT="$(keytool -printcert -jarfile "$AAB" -v 2>/dev/null | awk -F': ' '/SHA256: / {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$AAB_CERT" || "$AAB_CERT" != "$KEY_CERT" ]]; then
            echo "::error::AAB signer certificate does not match the configured production keystore."
            exit 1
          fi
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='com.aistudio.omnitranslate.qkvzpt' versionCode='2' versionName='1.0.1'" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "APK and AAB signature verification passed."
          echo "Signer SHA-256: $APK_CERT"
          echo "Package and version verified: com.aistudio.omnitranslate.qkvzpt / 1.0.1 (2)"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "${{ steps.verify_apk.outputs.apk_path }}" release-assets/OmniTranslate-v1.0.1-release.apk
          cp "${{ steps.verify_apk.outputs.aab_path }}" release-assets/OmniTranslate-v1.0.1-release.aab
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniTranslate-v1.0.1-verified-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OmniTranslate v1.0.1 Official Production Release
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f release.keystore
